<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Same build as links.notx.blue's avatar: the project's violet ink (ink-violet token)
       as ground, a paper card with a hard black shadow, a lucide icon in black.
       Colours are inlined: an SVG loaded as an image cannot read CSS custom properties. -->
  <rect width="100" height="100" fill="#551A8B"/>
  <!-- Scaled down around the centre so the card stays inside the maskable safe zone. -->
  <g transform="translate(50 50) scale(0.85) translate(-50 -50)">
    <rect x="26" y="26" width="56" height="56" fill="#000"/>
    <rect x="18" y="18" width="56" height="56" fill="#000"/>
    <rect x="22" y="22" width="48" height="48" fill="#F4F1EA"/>
    <!-- lucide-static 0.542.0 ghost.svg, scaled into the card. -->
    <g transform="translate(29.2 29.2) scale(1.4)" fill="none" stroke="#000" stroke-width="3" stroke-linecap="square" stroke-linejoin="miter">
      <path d="M9 10h.01"/>
      <path d="M15 10h.01"/>
      <path d="M12 2a8 8 0 0 0-8 8v12l3-3 2.5 2.5L12 19l2.5 2.5L17 19l3 3V10a8 8 0 0 0-8-8z"/>
    </g>
  </g>
</svg>
