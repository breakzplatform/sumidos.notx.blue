# Static site: Vite builds into dist/, which Netlify publishes as is.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# The privacy policy is shared by every notx.blue app.
[[redirects]]
  from = "/privacy"
  to = "https://notx.blue/privacy"
  status = 301
  force = true

# crickets.notx.blue is a domain alias of this site. Its root gets the copy
# of the page with English <head> tags, so link previews are in English.
[[redirects]]
  from = "https://crickets.notx.blue/"
  to = "/index.en.html"
  status = 200
  force = true
